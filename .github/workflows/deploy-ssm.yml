name: Deploy Python App using AWS SSM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "scripts/**"
      - ".github/workflows/deploy-ssm.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: ec2-python-app-ssm
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy through Systems Manager
    runs-on: ubuntu-latest
    environment: ssm-deployment

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate AWS identity
        run: aws sts get-caller-identity

      - name: Verify EC2 is an SSM managed instance
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          test -n "$INSTANCE_ID"
          aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text | grep -qx Online

      - name: Prepare deployment bundle
        run: |
          tar -czf app-bundle.tar.gz app scripts/deploy.sh

      - name: Upload deployment bundle to temporary S3 location
        id: upload
        env:
          BUCKET: ${{ vars.DEPLOYMENT_BUCKET }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          KEY="deployments/${GITHUB_SHA}/app-bundle.tar.gz"
          aws s3 cp app-bundle.tar.gz "s3://$BUCKET/$KEY"
          echo "s3_key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Deploy on EC2 with SSM Run Command
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          BUCKET: ${{ vars.DEPLOYMENT_BUCKET }}
          S3_KEY: ${{ steps.upload.outputs.s3_key }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Python app from GitHub Actions ${GITHUB_SHA}" \
            --parameters "commands=[
              \"set -e\",
              \"mkdir -p /tmp/python-app-deploy\",
              \"aws s3 cp s3://$BUCKET/$S3_KEY /tmp/python-app-deploy/app-bundle.tar.gz\",
              \"tar -xzf /tmp/python-app-deploy/app-bundle.tar.gz -C /tmp/python-app-deploy\",
              \"cd /tmp/python-app-deploy\",
              \"bash scripts/deploy.sh\"
            ]" \
            --query 'Command.CommandId' --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "SSM deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" || true
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Timed out waiting for SSM command."
          exit 1

      - name: Verify application service
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["systemctl is-active aws-python-app"]' \
            --query 'Command.CommandId' --output text
